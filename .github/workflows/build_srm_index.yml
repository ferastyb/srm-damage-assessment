name: Build SRM Index

on:
  workflow_dispatch:
  push:
    paths:
      - "build_srm_index.py"
      - "srm_index_schema.sql"
      - "srm_library/**"

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyPDF2

      - name: Build SRM index
        run: |
          python build_srm_index.py --in srm_library --out srm_index.db --wipe
          ls -lh srm_index.db

      - name: Commit rebuilt index
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add srm_index.db
          git commit -m "Rebuild srm_index.db (GitHub Actions)" || echo "No changes to commit"
          git push
